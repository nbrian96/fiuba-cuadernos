name: Deploy FIUBA Cuadernos to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro & Zod content check
        run: npm run check

      - name: TypeScript check
        run: npm run typecheck

      - name: Run Vitest suite
        run: npm test

      - name: Cache PDF text extraction
        uses: actions/cache@v4
        with:
          path: .astro/pdf-text-cache.json
          key: pdf-text-cache-v1-${{ hashFiles('materias/**/*.pdf') }}
          restore-keys: |
            pdf-text-cache-v1-

      - name: Build static site for GitHub Pages
        env:
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io
          ASTRO_BASE: /${{ github.event.repository.name }}/
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify compiled dist/ artifacts
        run: node scripts/verify-astro-build.mjs --base="/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
